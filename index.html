<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Café Empatía Real</title>
                <!-- Tailwind CSS para el diseño -->
                    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
                        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
                            <style>
                                    body { font-family: 'Plus Jakarta Sans', sans-serif; }
                                        </style>
                                        </head>
                                        <body class="bg-[#12100E] text-[#E6E1DA] min-h-screen flex flex-col justify-between p-6">

                                            <!-- Cabecera -->
                                                <header class="w-full max-w-md mx-auto flex justify-between items-center py-4">
                                                        <span class="text-sm tracking-widest text-[#D4A373] uppercase font-medium">1:1 Anónimo</span>
                                                                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Sistema Activo"></div>
                                                                    </header>

                                                                        <!-- Contenido Principal -->
                                                                            <main class="w-full max-w-md mx-auto my-auto text-center space-y-6">
                                                                                    <div class="inline-block p-3 rounded-2xl bg-[#2A2421] border border-[#3E3530] mb-2">
                                                                                                <span class="text-3xl">☕</span>
                                                                                                        </div>
                                                                                                                
                                                                                                                        <h1 class="text-3xl sm:text-4xl font-semibold tracking-tight text-[#FDFBF7]">
                                                                                                                                    Café Empatía Real
                                                                                                                                            </h1>
                                                                                                                                                    
                                                                                                                                                            <p class="text-[#B0A89F] text-base leading-relaxed px-2">
                                                                                                                                                                        Un espacio privado, uno a uno, para hablar con un ser humano real cuando el pecho aprieta. Sin bots, sin juicios, sin ruido digital.
                                                                                                                                                                                </p>

                                                                                                                                                                                        <!-- Botón de Acción -->
                                                                                                                                                                                                <div class="pt-4 space-y-3">
                                                                                                                                                                                                            <button onclick="alert('Próximamente: Conexión con pasarela USDT de 1$')" class="w-full py-4 px-6 rounded-xl bg-[#D4A373] text-[#12100E] font-semibold text-base hover:bg-[#C29362] transition shadow-lg shadow-[#D4A373]/10 cursor-pointer">
                                                                                                                                                                                                                            Invitar un café fundador ($1 USDT)
                                                                                                                                                                                                                                        </button>
                                                                                                                                                                                                                                                    <p class="text-xs text-[#7A726A]">
                                                                                                                                                                                                                                                                    Tu aporte mantiene abierta la mesa y alimenta nuestra caja de ayuda humanitaria.
                                                                                                                                                                                                                                                                                </p>
                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                <!-- Pie de página -->
                                                                                                                                                                                                                                                                                                    <footer class="w-full max-w-md mx-auto text-center py-4 text-xs text-[#7A726A]">
                                                                                                                                                                                                                                                                                                            Café Empatía Real &bull; Diseñado para la calma
                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                </html>
